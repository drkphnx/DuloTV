plugins { id 'com.android.application' }

android {
    namespace 'gd.dulo.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'gd.dulo.tv'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0-ultralite'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
